# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules
input AMPLIFY { globalAuthRule: AuthRule = { allow: public } } # FOR TESTING ONLY!

input AMPLIFY { globalAuthRule: AuthRule = { allow: public } } # FOR TESTING ONLY!

type User
  @model
  @auth(
    rules: [
      { allow: owner } # Users can only manage their own data
    ]
  ) {
  id: ID!
  username: String!
  email: String!
  reviews: [Review] @hasMany
  favorites: [Favorite] @hasMany
  reservations: [Reservation] @hasMany
}

type Business
  @model
  @auth(
    rules: [
      { allow: public, operations: [read] } # Anyone can READ businesses
      { allow: private, operations: [create, update, delete] } # Only signed-in users can manage
      { allow: owner, operations: [update] } # Business owners can edit their own businesses
    ]
  ) {
  id: ID!
  name: String!
  category: String!
  address: String!
  latitude: Float
  longitude: Float
  phoneNumber: String
  website: String
  rating: Float
  images: [String]
  reviews: [Review] @hasMany
  reservations: [Reservation] @hasMany
  claimedBy: String @index(name: "byOwner") # Allows owners to claim businesses
  createdAt: AWSDateTime
}

type Review
  @model
  @auth(
    rules: [
      { allow: owner } # Only review authors can modify their reviews
      { allow: private, operations: [read] } # Any signed-in user can read reviews
    ]
  ) {
  id: ID!
  content: String!
  rating: Int!
  businessID: ID! @index(name: "byBusiness")
  owner: String
  helpfulVotes: Int @default(value: "0") # Allows users to "like" helpful reviews
  createdAt: AWSDateTime
}

type Favorite
  @model
  @auth(
    rules: [
      { allow: owner } # Users can only manage their own favorites
    ]
  ) {
  id: ID!
  businessID: ID! @index(name: "byUser")
  userID: ID!
  createdAt: AWSDateTime
}

type Reservation
  @model
  @auth(
    rules: [
      { allow: owner } # Users can manage their own reservations
      { allow: private, operations: [create, read] } # Users can create and view reservations
    ]
  ) {
  id: ID!
  businessID: ID! @index(name: "byBusiness")
  userID: ID!
  dateTime: AWSDateTime!
  status: String @default(value: "pending") # pending, confirmed, canceled
  createdAt: AWSDateTime
}
